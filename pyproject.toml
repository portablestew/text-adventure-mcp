[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text-adventure-mcp"
version = "0.1.0"
description = "MCP server that holds a TCP connection open to a line-oriented text service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
text-adventure-mcp = "text_adventure_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/text_adventure_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
