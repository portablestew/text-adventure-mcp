[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text-adventure-mcp"
dynamic = ["version"]
description = "MCP server that holds a TCP connection open to a line-oriented text service."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Anthony Nguyen", email = "portablestew@gmail.com" }]
dependencies = ["mcp>=2,<3"]

[project.urls]
Repository = "https://github.com/portablestew/text-adventure-mcp"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
text-adventure-mcp = "text_adventure_mcp.server:main"

[tool.hatch.version]
path = "src/text_adventure_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/text_adventure_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
